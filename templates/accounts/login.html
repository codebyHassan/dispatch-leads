{% extends "base.html" %}
{% block title %}Sign In — Dispatch Lead Finder & CRM{% endblock %}
{% block content %}
<div style="max-width: 380px; margin: 60px auto;" class="panel-strong">
  <h1 style="margin-bottom: 6px;">DISPATCH LEAD FINDER</h1>
  <p class="muted" style="margin-top: 0; margin-bottom: 18px;">US Carrier Discovery & Dispatch Sales CRM</p>

  {% if error %}
    <div class="alert">{{ error }}</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="id_username">Username</label>
      <input id="id_username" type="text" name="username" required autofocus value="admin">
    </div>
    <div class="form-group">
      <label for="id_password">Password</label>
      <input id="id_password" type="password" name="password" required value="admin123">
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 6px;">Sign In</button>
  </form>
  <p class="help-text" style="margin-top: 12px;">Default credentials: <span class="mono">admin</span> / <span class="mono">admin123</span></p>
</div>
{% endblock %}
